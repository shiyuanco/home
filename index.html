  <title>實垣管理系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #e8dcc8;
      font-family: 'Microsoft JhengHei', '微軟正黑體', 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    /* 主頁 */
    #home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
      width: 100%;
      max-width: 360px;
    }

    .title {
      font-size: 16px;
      letter-spacing: 0.3em;
      color: #6b5440;
      margin-bottom: 0.5rem;
      font-weight: 400;
    }

    .subtitle-line {
      width: 60px;
      height: 1px;
      background: #b09a7a;
      margin: 0.5rem auto 2rem;
    }

    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      align-items: center;
    }

    .stamp-btn {
      display: block;
      width: 160px;
      height: 160px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .stamp-btn:active {
      transform: scale(0.93);
      opacity: 0.85;
    }

    .stamp-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .footer {
      margin-top: 2rem;
      font-size: 11px;
      color: #9a8068;
      letter-spacing: 0.2em;
    }

    /* iframe 頁面 */
    #iframe-view {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #fff;
      z-index: 100;
    }

    #iframe-view.active {
      display: flex;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      height: 52px;
      background: #e8dcc8;
      padding: 0 16px;
      flex-shrink: 0;
      border-bottom: 1px solid #c4aa88;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: #6b5440;
      font-size: 15px;
      font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding: 8px 8px 8px 0;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: #6b5440;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .nav-title {
      flex: 1;
      text-align: center;
      font-size: 15px;
      color: #4a3728;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-right: 52px;
    }

    #page-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    .loading {
      position: absolute;
      top: 52px;
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0e8;
      color: #9a8068;
      font-size: 14px;
      letter-spacing: 0.1em;
    }
  </style>
</head>

  <!-- iframe 子頁面 -->
  <div id="iframe-view">
    <div class="nav-bar">
      <button class="back-btn" onclick="closePage()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        返回
      </button>
      <span class="nav-title" id="nav-title"></span>
    </div>
    <div class="loading" id="loading">載入中…</div>
    <iframe id="page-iframe" onload="document.getElementById('loading').style.display='none'"></iframe>
  </div>

  <script>
    function openPage(url, title) {
      document.getElementById('nav-title').textContent = title;
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('page-iframe').src = url;
      document.getElementById('iframe-view').classList.add('active');
      document.getElementById('home').style.opacity = '0';
    }

    function closePage() {
      document.getElementById('iframe-view').classList.remove('active');
      document.getElementById('home').style.opacity = '1';
      document.getElementById('page-iframe').src = '';
    }

    // 手機返回鍵支援
    window.addEventListener('popstate', function() {
      if (document.getElementById('iframe-view').classList.contains('active')) {
        closePage();
      }
    });

    document.querySelectorAll('.stamp-btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.93)';
        this.style.opacity = '0.85';
      });
      btn.addEventListener('touchend', function() {
        this.style.transform = '';
        this.style.opacity = '';
      });
    });
  </script>
